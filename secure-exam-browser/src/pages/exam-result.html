<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Results - ExamEye Secure Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .score-display {
            font-size: 4rem;
            font-weight: bold;
            margin: 20px 0;
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .score-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .score-value {
            font-size: 2rem;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 5px;
        }

        .score-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .exam-info {
            background: rgba(52, 152, 219, 0.2);
            border: 1px solid rgba(52, 152, 219, 0.5);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .question-review {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .question-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #95a5a6;
        }

        .question-item.correct {
            border-left-color: #2ecc71;
        }

        .question-item.incorrect {
            border-left-color: #e74c3c;
        }

        .question-item.flagged {
            border-left-color: #f39c12;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .question-number {
            font-weight: bold;
            color: #3498db;
        }

        .question-status {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-correct { background: #2ecc71; color: white; }
        .status-incorrect { background: #e74c3c; color: white; }
        .status-unanswered { background: #95a5a6; color: white; }
        .status-flagged { background: #f39c12; color: white; }

        .question-text {
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .options-list {
            margin-bottom: 15px;
        }

        .option-item {
            padding: 8px 15px;
            margin: 5px 0;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
        }

        .option-item.selected {
            background: rgba(52, 152, 219, 0.3);
            border: 1px solid #3498db;
        }

        .option-item.correct {
            background: rgba(46, 204, 113, 0.3);
            border: 1px solid #2ecc71;
        }

        .option-item.incorrect {
            background: rgba(231, 76, 60, 0.3);
            border: 1px solid #e74c3c;
        }

        .security-report {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.5);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .security-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .security-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .security-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e74c3c;
        }

        .security-events {
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
        }

        .event-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
        }

        .event-time {
            color: #3498db;
            font-weight: bold;
        }

        .button {
            background: linear-gradient(45deg, #3498db, #2980b9);
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
            text-decoration: none;
            display: inline-block;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .button.primary {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
        }

        .button.secondary {
            background: linear-gradient(45deg, #95a5a6, #7f8c8d);
        }

        .actions {
            text-align: center;
            margin-top: 30px;
        }

        .grade-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.2rem;
            margin: 10px 0;
        }

        .grade-a { background: linear-gradient(45deg, #2ecc71, #27ae60); }
        .grade-b { background: linear-gradient(45deg, #3498db, #2980b9); }
        .grade-c { background: linear-gradient(45deg, #f39c12, #e67e22); }
        .grade-d { background: linear-gradient(45deg, #e67e22, #d35400); }
        .grade-f { background: linear-gradient(45deg, #e74c3c, #c0392b); }

        .loading {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎓 Exam Results</h1>
        <p>Your performance summary and detailed analysis</p>
    </div>

    <div class="container">
        <div id="loadingContainer" class="loading">
            <div class="spinner"></div>
            <p>Loading your exam results...</p>
        </div>

        <div id="resultsContainer" style="display: none;">
            <!-- Results will be loaded here -->
        </div>
    </div>

    <script>
        let examPlatformUrl = 'http://localhost:3000';
        let authToken = localStorage.getItem('authToken');

        document.addEventListener('DOMContentLoaded', () => {
            loadExamResults();
        });

        async function loadExamResults() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const resultId = urlParams.get('resultId');
                const examId = urlParams.get('examId');
                
                let apiUrl;
                if (resultId) {
                    apiUrl = `${examPlatformUrl}/api/results/${resultId}`;
                } else if (examId) {
                    // Get latest result for this exam
                    apiUrl = `${examPlatformUrl}/api/results/exam/${examId}/latest`;
                } else {
                    throw new Error('No result or exam ID provided');
                }

                const response = await fetch(apiUrl, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    displayResults(result);
                } else {
                    throw new Error('Failed to load results');
                }

            } catch (error) {
                console.error('Error loading results:', error);
                showError('Failed to load exam results. Please try again.');
            }
        }

        function displayResults(result) {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('resultsContainer').style.display = 'block';
            
            const container = document.getElementById('resultsContainer');
            
            // Calculate percentage and grade
            const percentage = Math.round((result.score / result.totalQuestions) * 100);
            const grade = calculateGrade(percentage);
            
            container.innerHTML = `
                <div class="result-card">
                    <h2>🎯 Your Score</h2>
                    <div class="score-display">${result.score}/${result.totalQuestions}</div>
                    <div class="grade-badge grade-${grade.toLowerCase()}">${grade} Grade (${percentage}%)</div>
                    
                    <div class="score-details">
                        <div class="score-item">
                            <div class="score-value">${result.correctAnswers || result.score}</div>
                            <div class="score-label">Correct Answers</div>
                        </div>
                        <div class="score-item">
                            <div class="score-value">${result.incorrectAnswers || (result.totalQuestions - result.score)}</div>
                            <div class="score-label">Incorrect Answers</div>
                        </div>
                        <div class="score-item">
                            <div class="score-value">${result.unanswered || 0}</div>
                            <div class="score-label">Unanswered</div>
                        </div>
                        <div class="score-item">
                            <div class="score-value">${Math.round((result.timeSpent || 0) / 60)}</div>
                            <div class="score-label">Minutes Spent</div>
                        </div>
                    </div>
                </div>

                <div class="exam-info">
                    <h3>📋 Exam Information</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <span>Exam Title:</span>
                            <span>${result.examTitle}</span>
                        </div>
                        <div class="info-item">
                            <span>Subject:</span>
                            <span>${result.examSubject || 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span>Submitted:</span>
                            <span>${new Date(result.submittedAt).toLocaleString()}</span>
                        </div>
                        <div class="info-item">
                            <span>Duration:</span>
                            <span>${result.examDuration || 'N/A'} minutes</span>
                        </div>
                        <div class="info-item">
                            <span>Passing Score:</span>
                            <span>${result.passingScore || 60}%</span>
                        </div>
                        <div class="info-item">
                            <span>Status:</span>
                            <span style="color: ${percentage >= (result.passingScore || 60) ? '#2ecc71' : '#e74c3c'}">
                                ${percentage >= (result.passingScore || 60) ? 'PASSED' : 'FAILED'}
                            </span>
                        </div>
                    </div>
                </div>

                ${result.questions ? generateQuestionReview(result) : ''}
                ${result.securityEvents ? generateSecurityReport(result) : ''}

                <div class="actions">
                    <button class="button primary" onclick="printResults()">📄 Print Results</button>
                    <button class="button secondary" onclick="goToDashboard()">← Back to Dashboard</button>
                    <button class="button" onclick="retakeExam()">🔄 Retake Exam</button>
                </div>
            `;
        }

        function calculateGrade(percentage) {
            if (percentage >= 90) return 'A';
            if (percentage >= 80) return 'B';
            if (percentage >= 70) return 'C';
            if (percentage >= 60) return 'D';
            return 'F';
        }

        function generateQuestionReview(result) {
            if (!result.questions || result.questions.length === 0) {
                return '';
            }

            let reviewHtml = `
                <div class="question-review">
                    <h3>📝 Question Review</h3>
            `;

            result.questions.forEach((question, index) => {
                const userAnswer = result.answers ? result.answers[index] : null;
                const isCorrect = userAnswer === question.correctAnswer;
                const isFlagged = result.flaggedQuestions && result.flaggedQuestions.includes(index);
                const isAnswered = userAnswer !== null && userAnswer !== undefined;

                let statusClass = 'unanswered';
                let statusText = 'Unanswered';

                if (isAnswered) {
                    if (isCorrect) {
                        statusClass = 'correct';
                        statusText = 'Correct';
                    } else {
                        statusClass = 'incorrect';
                        statusText = 'Incorrect';
                    }
                }

                if (isFlagged) {
                    statusClass += ' flagged';
                    statusText += ' (Flagged)';
                }

                reviewHtml += `
                    <div class="question-item ${statusClass}">
                        <div class="question-header">
                            <span class="question-number">Question ${index + 1}</span>
                            <span class="question-status status-${statusClass.split(' ')[0]}">${statusText}</span>
                        </div>
                        
                        <div class="question-text">${question.question}</div>
                        
                        <div class="options-list">
                            ${question.options.map((option, optionIndex) => {
                                let optionClass = 'option-item';
                                
                                if (optionIndex === question.correctAnswer) {
                                    optionClass += ' correct';
                                }
                                
                                if (optionIndex === userAnswer && optionIndex !== question.correctAnswer) {
                                    optionClass += ' incorrect';
                                }
                                
                                if (optionIndex === userAnswer) {
                                    optionClass += ' selected';
                                }
                                
                                return `
                                    <div class="${optionClass}">
                                        ${String.fromCharCode(65 + optionIndex)}) ${option}
                                        ${optionIndex === question.correctAnswer ? ' ✓' : ''}
                                        ${optionIndex === userAnswer && optionIndex !== question.correctAnswer ? ' ✗' : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        
                        ${question.explanation ? `
                            <div style="background: rgba(52, 152, 219, 0.2); padding: 10px; border-radius: 8px; margin-top: 10px;">
                                <strong>Explanation:</strong> ${question.explanation}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            reviewHtml += '</div>';
            return reviewHtml;
        }

        function generateSecurityReport(result) {
            if (!result.securityEvents || result.securityEvents.length === 0) {
                return `
                    <div class="security-report">
                        <h3>🔒 Security Report</h3>
                        <p style="color: #2ecc71; text-align: center; padding: 20px;">
                            ✅ No security violations detected. Exam completed with full integrity.
                        </p>
                    </div>
                `;
            }

            // Count different types of violations
            const violations = {
                focusLost: 0,
                tabSwitch: 0,
                rightClick: 0,
                copyAttempts: 0,
                keyboardShortcuts: 0,
                other: 0
            };

            result.securityEvents.forEach(event => {
                if (event.type.includes('focus')) violations.focusLost++;
                else if (event.type.includes('tab') || event.type.includes('switch')) violations.tabSwitch++;
                else if (event.type.includes('right-click')) violations.rightClick++;
                else if (event.type.includes('copy') || event.type.includes('paste')) violations.copyAttempts++;
                else if (event.type.includes('key')) violations.keyboardShortcuts++;
                else violations.other++;
            });

            return `
                <div class="security-report">
                    <h3>🔒 Security Report</h3>
                    <p style="margin-bottom: 20px;">Security monitoring detected the following activities during your exam:</p>
                    
                    <div class="security-stats">
                        <div class="security-item">
                            <div class="security-value">${violations.focusLost}</div>
                            <div class="score-label">Focus Lost</div>
                        </div>
                        <div class="security-item">
                            <div class="security-value">${violations.tabSwitch}</div>
                            <div class="score-label">Tab Switches</div>
                        </div>
                        <div class="security-item">
                            <div class="security-value">${violations.rightClick}</div>
                            <div class="score-label">Right Clicks</div>
                        </div>
                        <div class="security-item">
                            <div class="security-value">${violations.copyAttempts}</div>
                            <div class="score-label">Copy Attempts</div>
                        </div>
                        <div class="security-item">
                            <div class="security-value">${violations.keyboardShortcuts}</div>
                            <div class="score-label">Blocked Shortcuts</div>
                        </div>
                        <div class="security-item">
                            <div class="security-value">${result.securityEvents.length}</div>
                            <div class="score-label">Total Events</div>
                        </div>
                    </div>
                    
                    <h4 style="margin: 20px 0 10px 0;">📊 Security Event Log</h4>
                    <div class="security-events">
                        ${result.securityEvents.slice(0, 20).map(event => `
                            <div class="event-item">
                                <span class="event-time">${new Date(event.timestamp).toLocaleTimeString()}</span> - 
                                ${event.type}: ${event.details}
                            </div>
                        `).join('')}
                        ${result.securityEvents.length > 20 ? `
                            <div class="event-item" style="text-align: center; font-style: italic;">
                                ... and ${result.securityEvents.length - 20} more events
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('loadingContainer').innerHTML = `
                <div style="text-align: center; padding: 50px;">
                    <h2 style="color: #e74c3c; margin-bottom: 20px;">❌ Error</h2>
                    <p>${message}</p>
                    <button class="button" onclick="location.reload()" style="margin-top: 20px;">Try Again</button>
                    <button class="button secondary" onclick="goToDashboard()" style="margin-top: 20px;">← Back to Dashboard</button>
                </div>
            `;
        }

        function printResults() {
            window.print();
        }

        function goToDashboard() {
            window.location.href = './student-dashboard.html';
        }

        function retakeExam() {
            if (confirm('Are you sure you want to retake this exam? This will start a new attempt.')) {
                // Implementation would depend on exam retake policies
                alert('Retake functionality would be implemented based on your institution\'s policies.');
            }
        }
    </script>
</body>
</html>
